name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a stable version on main with release notes
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync, existsSync, readFileSync} from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag) || tag !== `v${pkg.version}`) {
            throw new Error('Tag must be a stable version matching package.json.');
          }
          if (!existsSync(`docs/releases/${tag}.md`)) throw new Error('Release notes are required.');
          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\nimage=${image}\n`);
          NODE
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  verify:
    name: Release verification
    needs: version
    uses: ./.github/workflows/verify.yml

  images:
    name: Publish tested image (${{ matrix.arch }})
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_IMAGE: ${{ needs.version.outputs.image }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release image on its native architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          provenance: false
          tags: veritas:release
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=veritas-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=veritas-${{ matrix.arch }}
      - name: Verify the exact image before pushing
        run: bash scripts/ci-container-smoke.sh veritas:release
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture tags
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag veritas:release "$RELEASE_IMAGE:$RELEASE_VERSION-$ARCH"
          docker tag veritas:release "$RELEASE_IMAGE:sha-$GITHUB_SHA-$ARCH"
          docker push "$RELEASE_IMAGE:$RELEASE_VERSION-$ARCH"
          docker push "$RELEASE_IMAGE:sha-$GITHUB_SHA-$ARCH"

  manifest:
    name: Publish multi-architecture manifest
    needs: [version, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    env:
      RELEASE_IMAGE: ${{ needs.version.outputs.image }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge and verify amd64 and arm64
        id: manifest
        run: |
          docker buildx imagetools create \
            --tag "$RELEASE_IMAGE:$RELEASE_VERSION" \
            --tag "$RELEASE_IMAGE:sha-$GITHUB_SHA" \
            "$RELEASE_IMAGE:sha-$GITHUB_SHA-amd64" \
            "$RELEASE_IMAGE:sha-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$RELEASE_IMAGE:$RELEASE_VERSION" \
            --format '{{json .Manifest}}' > /tmp/veritas-manifest.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {appendFileSync, readFileSync} from 'node:fs';
          const manifest = JSON.parse(readFileSync('/tmp/veritas-manifest.json', 'utf8'));
          assert.deepEqual(manifest.manifests.map(m => `${m.platform.os}/${m.platform.architecture}`).sort(),
            ['linux/amd64', 'linux/arm64']);
          assert.match(manifest.digest, /^sha256:[a-f0-9]{64}$/);
          appendFileSync(process.env.GITHUB_OUTPUT, `digest=${manifest.digest}\n`);
          NODE

  release:
    name: Publish Helm and GitHub Release
    needs: [version, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
      RELEASE_IMAGE: ${{ needs.version.outputs.image }}
      RELEASE_IMAGE_DIGEST: ${{ needs.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart, Compose file, manifest and checksums
        run: node scripts/package-release.mjs "v$RELEASE_VERSION"
      - name: Publish Helm OCI chart
        run: |
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/release/tasklattice-veritas-$RELEASE_VERSION.tgz" oci://ghcr.io/tasklattice/charts
      - name: Publish latest image alias
        run: docker buildx imagetools create --tag "$RELEASE_IMAGE:latest" "$RELEASE_IMAGE@$RELEASE_IMAGE_DIGEST"
      - name: Create official release with explicit assets
        run: |
          gh release create "v$RELEASE_VERSION" --verify-tag \
            --title "TaskLattice Veritas v$RELEASE_VERSION" \
            --notes-file "docs/releases/v$RELEASE_VERSION.md" \
            "dist/release/tasklattice-veritas-$RELEASE_VERSION.tgz" \
            dist/release/compose.yaml dist/release/release-manifest.json dist/release/SHA256SUMS
