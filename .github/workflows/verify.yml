name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMPTFOO_DISABLE_TELEMETRY: '1'
  PROMPTFOO_DISABLE_UPDATE: '1'

jobs:
  checks:
    name: Source and synthetic integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Inspect tracked files for private artifacts and credentials
        run: npm run check:publication
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and API tests (no downloaded archives required)
        run: npm test
      - name: F5, LiteLLM and offline re-scoring
        run: npm run test:integration
      - name: Typecheck and build frontend
        run: npm run build

  helm:
    name: Helm and Compose manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Lint and render chart
        run: |
          helm lint --strict charts/tasklattice-veritas
          helm template veritas charts/tasklattice-veritas --kube-version 1.31.0 > /tmp/veritas-default.yaml
          helm template veritas charts/tasklattice-veritas --kube-version 1.31.0 --set persistence.existingClaim=existing-state > /tmp/veritas-existing.yaml
          helm template veritas charts/tasklattice-veritas --kube-version 1.31.0 --set persistence.enabled=false > /tmp/veritas-disposable.yaml
          helm package charts/tasklattice-veritas --destination /tmp
      - name: Validate Compose
        run: docker compose config --quiet

  image:
    name: Image and runtime (${{ matrix.arch }})
    needs: [checks, helm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image on its native architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: veritas:ci
          cache-from: type=gha,scope=veritas-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=veritas-${{ matrix.arch }}
      - name: Check startup, both protocols and persistent Reports
        run: bash scripts/ci-container-smoke.sh veritas:ci
